<div class="card h-100">
    <div class="card-header">   <!--type div.card-header to scaffold this-->
      <h3 class="card-title">Images</h3>
    </div>

    <div class="card-body">
      <!--we have two containers - one on the left side for images, on the right for upload functionality-->
      <!--also, the flex-md-row and flex-sm-column allows for responsive design to show columns on smaller screens, or rows otherwise (div with col-8, another w/ col-4)-->
      <div class="d-flex flex-md-row flex-sm-column flex-wrap">
        <div class="col-8 p-4" style="overflow-y: scroll;">
            @if (images$ | async; as images) {              <!-- instead of using @ngIf, use new template control flow features in @if and @for as of Angular 17 -->  
                <div class="d-flex flex-wrap">
                @for (image of images; track image.id) {
                    <div (click)="selectImage(image)"
                        style="min-width: 100px;justify-content: center; cursor: pointer;"
                        class="me-1 bg-white d-flex align-items-center flex-column border p-3">
                        <img [src]="image.url" [title]="image.title" style="height: 100px;">
                        <span class="mt-1">{{image.title}}</span>
                    </div>
                }
                </div>
            }
        </div>

        <div class="col-4 p-4 bg-light">
          <h5>Upload Image</h5>
          <form (ngSubmit)="uploadImage(form)" #form="ngForm">
            <div class="mt-3">
              <input type="file" class="form-control" (change)="onFileUploadChange($event)">
            </div>
            
            <div class="mt-3">
              <input type="text" class="form-control"
              placeholder="File Name" name="filename" [(ngModel)]="fileName">
            </div>
            
            <div class="mt-3">
              <input type="text" class="form-control"
              placeholder="Title" name="title" [(ngModel)]="title">
            </div>
            
            <div class="mt-3">
              <button type="submit" class="btn btn-dark">Upload</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
